services:
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: todo_db_user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_db_user -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  todo-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: todo_db_user
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: tododb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - todo-db-data:/data/db

  auth-service:
    build: ./auth-service
    environment:
      DB_HOST: auth-db
      DB_PORT: "5432"
      DB_NAME: authdb
      DB_USERNAME: todo_db_user
      DB_PASSWORD: password
    ports:
      - "3005:3005"
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3005 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  todo-service:
    build: ./todo-service
    environment:
      DB_HOST: todo-db
      DB_PORT: "27017"
      DB_NAME: tododb
      DB_USERNAME: todo_db_user
      DB_PASSWORD: password
    ports:
      - "3006:3006"
    depends_on:
      todo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net');const s=net.connect(3006,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api-service:
    build: ./api-service
    environment:
      AUTH_SERVICE_URL: auth-service:3005
      TODO_SERVICE_URL: todo-service:3006
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_healthy
      todo-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"

volumes:
  auth-db-data:
  todo-db-data:
